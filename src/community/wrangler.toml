name = "scriptboard-community"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Create the database once with: npx wrangler d1 create scriptboard-community
# then paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "scriptboard-community"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[rules]]
type = "Text"
globs = ["**/*.html"]
