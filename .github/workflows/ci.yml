name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test -count=1 ./...
      # The files that only some systems build are checked by vetting for each.
      - name: Vet the other platforms
        run: |
          for target in windows/amd64 darwin/amd64 linux/arm64; do
            echo "vet $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done
      # The community Worker's smoke test needs wrangler, so it is not run here;
      # this only checks that the JavaScript parses (Node is on the runner).
      - run: node --check src/community/src/index.js
